name: Something isn't working
description: SpamGuard blocked something it shouldn't, missed spam, or misbehaved
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please don't paste your openHop API token, channel keys or anyone's real messages. If you share an evidence log, use the **Names scrambled** download.
  - type: input
    id: version
    attributes:
      label: SpamGuard version
      description: Shown next to the name at the top of SpamGuard's page, for example 5.36
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is it installed?
      options: [openHop plugin, Docker container, Older install (systemd), Not sure]
    validations:
      required: true
  - type: input
    id: openhop
    attributes:
      label: openHop version and hardware
      description: For example openHop 1.1.5 on a Raspberry Pi 3
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Screenshots of SpamGuard's page (Blocks, Messages or Health) help a lot.
    validations:
      required: true
  - type: textarea
    id: health
    attributes:
      label: Anything on the Health page?
      description: Any warnings shown there, if you can see them.
