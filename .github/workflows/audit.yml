# Bandit (high severity only) looks for risky patterns in the Python; pip-audit checks the dependencies for known vulnerabilities.
name: Audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "13 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bandit
        run: |
          python -m pip install bandit==1.7.10
          bandit -q -r spamguard.py tools -lll
      - name: pip-audit
        run: |
          python -m pip install pip-audit==2.7.3
          printf 'pycryptodome>=3.15\nPyYAML>=5.4\n' > req.txt
          pip-audit -r req.txt
