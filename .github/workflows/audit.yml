# Bandit (high severity only) looks for risky patterns in the Python; pip-audit checks the dependencies for known vulnerabilities.
name: Audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "13 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Bandit
        run: |
          python -m pip install --require-hashes -r requirements/audit.txt
          bandit -q -r spamguard.py tools -lll
      - name: pip-audit
        run: pip-audit --require-hashes -r requirements/docker.txt
