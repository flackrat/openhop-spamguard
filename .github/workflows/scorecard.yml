# OpenSSF Scorecard: grades how the project is run (branch protection, pinned dependencies, security policy,
# releases) and publishes the score so the README badge can show it. It does not judge whether the code is correct.
name: Scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: "27 5 * * 1"
  push:
    branches: [main]
  workflow_dispatch:
permissions: read-all
jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@v4
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 14
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
