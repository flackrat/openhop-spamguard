# Runs the Atheris fuzzer (fuzz/fuzz_spamguard.py) briefly on changes to the code it exercises, and for longer once a week.
name: Fuzz
on:
  pull_request:
    paths: [spamguard.py, fuzz/**, .github/workflows/fuzz.yml]
  push:
    branches: [main]
    paths: [spamguard.py, fuzz/**, .github/workflows/fuzz.yml]
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --require-hashes -r requirements/fuzz.txt
      - name: Fuzz
        run: |
          secs=60; [ "${{ github.event_name }}" = "schedule" ] && secs=600
          python fuzz/fuzz_spamguard.py -max_total_time=$secs
