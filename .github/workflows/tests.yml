# Runs SpamGuard's own test suite on every push and pull request.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements/ci.txt
      - name: Run the tests
        run: |
          set +e
          # The update script and plugin tests expect to run as root, as they do on a Pi.
          sudo git config --global --add safe.directory '*'
          sudo -E env "PATH=$PATH" bash tests/run_all.sh | tee out.txt
          rc=${PIPESTATUS[0]}
          grep -E "^(FAIL|      )" out.txt | head -20 | while IFS= read -r l; do echo "::error::$l"; done
          if [ $rc -ne 0 ]; then
            (cd tests && sudo -E env "PATH=$PATH" python3 testplugin.py 2>&1 | tail -30 | while IFS= read -r l; do echo "::error::testplugin: $l"; done)
          fi
          exit $rc
