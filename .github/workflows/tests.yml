# Runs SpamGuard's own test suite on every push and pull request.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "pycryptodome>=3.15" "PyYAML>=5.4" pynacl
      - name: Run the tests
        run: |
          set +e
          # The update script and plugin tests expect to run as root, as they do on a Pi.
          sudo git config --global --add safe.directory '*'
          sudo -E env "PATH=$PATH" bash tests/run_all.sh | tee out.txt
          rc=${PIPESTATUS[0]}
          grep -E "^(FAIL|      )" out.txt | head -20 | while IFS= read -r l; do echo "::error::$l"; done
          exit $rc
