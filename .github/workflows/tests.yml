# Runs SpamGuard's own test suite on every push and pull request.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Dependency review (no new packages with known vulnerabilities)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
      - name: Privacy check (no personal details, places or real-world examples)
        env:
          # A private list kept as a repository secret, so its entries never appear in the repository.
          PRIVACY_BLOCKLIST: ${{ secrets.PRIVACY_BLOCKLIST }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          rc=0
          python3 tools/privacy_check.py --tree || rc=1
          if [ -n "$BASE_REF" ]; then
            python3 tools/privacy_check.py --diff "origin/$BASE_REF" || rc=1
            python3 tools/privacy_check.py --text-env PR_TITLE PR_BODY || rc=1
          fi
          exit $rc
      - name: Leak check (passwords, keys and tokens)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          v=8.28.0
          curl -fsSL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz"
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          if [ -n "$BASE_REF" ]; then opts="origin/$BASE_REF..HEAD"; else opts="--all"; fi
          /tmp/gitleaks git --no-banner --redact --config .gitleaks.toml --log-opts="$opts" .
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements/ci.txt -r requirements/quality.txt
      - name: Coding standard (Ruff, warnings count as errors)
        run: ruff check --output-format github .
      - name: Reproducible build (building twice gives the same plugin file)
        run: |
          set -euo pipefail
          python tools/build_plugin.py /tmp/build-a >/dev/null
          python tools/build_plugin.py /tmp/build-b >/dev/null
          cmp /tmp/build-a/*.whl /tmp/build-b/*.whl && echo "Reproducible: $(sha256sum /tmp/build-a/*.whl | cut -c1-16)"
      - name: Run the tests
        run: |
          set +e
          # The update script and plugin tests expect to run as root, as they do on a Pi.
          sudo git config --global --add safe.directory '*'
          # Each test runs under coverage, so the report below shows how much of the shipped code they reach.
          sudo -E env "PATH=$PATH" SG_TEST_PY="python3 -m coverage run --parallel-mode --rcfile=../.coveragerc" bash tests/run_all.sh | tee out.txt
          rc=${PIPESTATUS[0]}
          (cd tests && sudo -E env "PATH=$PATH" python3 -m coverage combine -q --rcfile=../.coveragerc \
            && sudo -E env "PATH=$PATH" python3 -m coverage report --rcfile=../.coveragerc | tee ../coverage.txt) || true
          if [ -s coverage.txt ]; then
            { echo "### Test coverage of the shipped code"; echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Test coverage: $(awk '/^TOTAL/{print $NF}' coverage.txt)"
          fi
          grep -E "^(FAIL|      )" out.txt | head -20 | while IFS= read -r l; do echo "::error::$l"; done
          if [ $rc -ne 0 ]; then
            (cd tests && sudo -E env "PATH=$PATH" python3 testplugin.py 2>&1 | tail -30 | while IFS= read -r l; do echo "::error::testplugin: $l"; done)
          fi
          exit $rc
  personal-details:
    # A second opinion from Microsoft Presidio on names, places and contact details in the lines a pull
    # request adds. It guesses, so it only warns (see the annotations) and never blocks a merge.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/presidio.txt
      - name: Install Presidio
        run: python -m pip install --require-hashes -r requirements/presidio.txt
      - name: Look for personal details in the added lines
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python tools/presidio_check.py --diff "origin/$BASE_REF"
