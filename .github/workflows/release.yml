# Publishes a GitHub release whenever the version number in spamguard.py changes on main.
# The release notes are that version's section of CHANGELOG.md (its heading may carry extra text after the version). Uses GitHub's built-in
# token for this repository only; no personal token is stored anywhere.
# When CHANGELOG.md is edited, the notes of releases already published are brought in line with it.
name: Release
on:
  push:
    branches: [main]
    paths: [spamguard.py, CHANGELOG.md, Dockerfile, docker-entrypoint.sh, plugin/**, tools/build_plugin.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish release for a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v=$(sed -nE 's/^VERSION = "([0-9]+(\.[0-9]+){1,3})"$/\1/p' spamguard.py | head -1)
          [ -n "$v" ] || { echo "No VERSION found in spamguard.py"; exit 1; }
          if gh release view "v$v" >/dev/null 2>&1; then echo "v$v is already released"; exit 0; fi
          awk -v h="## v$v" '$0==h||index($0,h" ")==1||index($0,h":")==1{f=1;next} /^## v/{if(f)exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "SpamGuard $v" > notes.md
          # Download file for this version; the Pi's Update button fetches this, so its download
          # count shows roughly how many repeaters installed the update.
          git archive --format=tar.gz --prefix="spamguard-v$v/" -o "spamguard-v$v.tar.gz" HEAD
          # The openHop plugin file for this version (System > Plugins > Install wheel in openHop).
          python3 tools/build_plugin.py dist
          gh release create "v$v" "spamguard-v$v.tar.gz" dist/*.whl --target "$GITHUB_SHA" --title "SpamGuard v$v" --notes-file notes.md --latest
      - name: Sign the release wheel (build attestation)
        if: hashFiles('dist/*.whl') != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.whl
      - name: Bring existing release notes in line with CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for t in $(gh release list --limit 200 --json tagName --jq '.[].tagName'); do
            awk -v h="## $t" '$0==h||index($0,h" ")==1||index($0,h":")==1{f=1;next} /^## v/{if(f)exit} f' CHANGELOG.md > want.md
            [ -s want.md ] || continue
            gh release view "$t" --json body --jq .body > have.md
            if ! diff -qbB want.md have.md >/dev/null; then
              gh release edit "$t" --notes-file want.md
              echo "updated notes for $t"
            fi
          done
  image:
    # The Docker image for this version, for Pis (64- and 32-bit) and PCs, on GitHub's own registry.
    # Built once per version; later pushes that don't change the version leave it alone.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        id: v
        run: echo "v=$(sed -nE 's/^VERSION = "([0-9]+(\.[0-9]+){1,3})"$/\1/p' spamguard.py | head -1)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Already built?
        id: have
        run: |
          if docker manifest inspect "ghcr.io/flackrat/openhop-spamguard:${{ steps.v.outputs.v }}" >/dev/null 2>&1; then
            echo "skip=1" >> "$GITHUB_OUTPUT"; echo "Image for ${{ steps.v.outputs.v }} already published"
          fi
      - uses: docker/setup-qemu-action@v3
        if: steps.have.outputs.skip != '1'
      - uses: docker/setup-buildx-action@v3
        if: steps.have.outputs.skip != '1'
      - uses: docker/build-push-action@v6
        if: steps.have.outputs.skip != '1'
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/flackrat/openhop-spamguard:${{ steps.v.outputs.v }}
            ghcr.io/flackrat/openhop-spamguard:latest
