# Builds the Docker image (without publishing it) whenever the Dockerfile, its locked requirements or the release
# workflow change, so a bad base-image digest, requirements file or action update is caught before a release. The
# second build uses the same actions and platforms as the release (64- and 32-bit Pi, and PC).
name: Docker build
on:
  pull_request:
    paths: [Dockerfile, .dockerignore, requirements.txt, docker-entrypoint.sh, .github/workflows/docker-build.yml, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t spamguard-test .
      - name: Check the image starts and has its libraries
        run: docker run --rm --entrypoint python3 spamguard-test -c "import yaml, Crypto; import spamguard; print(spamguard.VERSION)"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for every platform the release publishes (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
