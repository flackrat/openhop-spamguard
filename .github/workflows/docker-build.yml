# Builds the Docker image (without publishing it) whenever the Dockerfile, its locked requirements or the release
# workflow change, so a bad base-image digest, requirements file or action update is caught before a release. The
# second build uses the same actions and platforms as the release (64- and 32-bit Pi, and PC).
name: Docker build
on:
  pull_request:
    paths: [Dockerfile, .dockerignore, requirements/docker.txt, docker-entrypoint.sh, .github/workflows/docker-build.yml, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t spamguard-test .
      - name: Check the image starts and has its libraries
        run: docker run --rm --entrypoint python3 spamguard-test -c "import yaml, Crypto; import spamguard; print(spamguard.VERSION)"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for every platform the release publishes (not pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
