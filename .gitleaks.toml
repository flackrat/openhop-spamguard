# Gitleaks settings for the leak check in .github/workflows/tests.yml: its standard rules for passwords,
# keys and tokens, apart from MeshCore's Public channel key, which is published and not a secret, and a made-up test key.
title = "SpamGuard"

[extend]
useDefault = true

[[allowlists]]
description = "MeshCore's published Public channel key, and a made-up channel key used in tests"
regexTarget = "secret"
regexes = ['''(?i)^8b3387e9c5cdea6ac9e5edbaa115cd72$''', '''(?i)^0123456789abcdef0123456789abcdef$''', '''(?i)^a1b2c3d4e5f60718293a4b5c6d7e8f90$''', '''(?i)^izOH6cXN6mrJ5e26oRXNcg==$''', '''(?i)^hWP/9A/bY2LhC30M9\+RYtw==$''']

# A MeshCore channel key (16 bytes, as 32 hex digits or base64) anywhere. A private channel's key is
# personal data and must never be committed; the Public key and the test key above are allowed.
[[rules]]
id = "meshcore-channel-key"
description = "MeshCore channel key"
regex = '''(?:^|[^0-9A-Za-z+/])([0-9a-fA-F]{32}|[A-Za-z0-9+/]{22}==)(?:[^0-9A-Za-z+/=]|$)'''
secretGroup = 1
